<template>
  <section class="dashboard">
    <div class="dashboard__banner">
      <div class="dashboard__banner-text">
        <p class="dashboard__welcome">{welcomeText}</p>
        <p class="dashboard__subtitle">
          Here's how your family's applications are going.
        </p>
      </div>
      <button
        lwc:if={showAddChild}
        type="button"
        class="dashboard__add"
        onclick={handleAddChildOpen}
      >
        Add a child
      </button>
    </div>

    <h2 class="dashboard__heading">{headingText}</h2>

    <c-children-grid
      lwc:if={isGridView}
      onchildselect={handleChildSelect}
    ></c-children-grid>

    <c-child-detail
      lwc:elseif={isDetailView}
      child-id={selectedChildId}
      onback={handleBack}
    ></c-child-detail>

    <c-add-child-dialog
      lwc:if={isAddChildOpen}
      onclose={handleAddChildClose}
    ></c-add-child-dialog>

    <c-family-assistant-chat lwc:if={showChat}></c-family-assistant-chat>
  </section>
</template>
