<template>
  <div class="detail">
    <button class="detail__back" type="button" onclick={handleBack}>
      &larr; Back to your children
    </button>

    <p lwc:if={isLoading} class="sr-only" role="status">
      Loading child details.
    </p>

    <div lwc:if={isPopulated} class="notranslate">
      <h3 class="detail__name">{displayName}</h3>
      <dl class="detail__facts">
        <dt>Grade</dt>
        <dd>{child.gradeLevel}</dd>
        <dt>School</dt>
        <dd>{child.schoolName}</dd>
        <dt>Date of birth</dt>
        <dd>{child.dateOfBirth}</dd>
        <dt>Relationship</dt>
        <dd>{child.relationshipType}</dd>
      </dl>

      <h4>Applications</h4>
      <table lwc:if={hasApplications} class="detail__table">
        <caption class="sr-only">
          Applications for {displayName}
        </caption>
        <thead>
          <tr>
            <th scope="col">School</th>
            <th scope="col">Status</th>
            <th scope="col">Lottery #</th>
            <th scope="col">Submitted</th>
          </tr>
        </thead>
        <tbody>
          <template for:each={applications} for:item="app">
            <tr key={app.id}>
              <td>{app.schoolName}</td>
              <td>
                <c-status-badge status={app.status}></c-status-badge>
              </td>
              <td>{app.lotteryNumber}</td>
              <td>{app.submittedDate}</td>
            </tr>
          </template>
        </tbody>
      </table>
      <p lwc:else>No applications yet for {displayName}.</p>
    </div>

    <div
      lwc:if={isError}
      class="state-message state-message--error"
      role="alert"
    >
      <h3>We couldn't load this child's details</h3>
      <p>
        Please try again, or contact Family Support if the problem continues.
      </p>
      <button type="button" onclick={handleRetry}>Try again</button>
    </div>
  </div>
</template>
